services:
  # =============================================
  # Spring Boot Backend API Server
  # =============================================
  backend:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: madarsa_backend
    ports:
      - "5000:5000"
    environment:
      # MySQL Database (Local MySQL - host.docker.internal for Windows/Mac)
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/madarsa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Salman@786
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      # JWT
      - JWT_SECRET=madarsa_imdadul_uloom_jwt_secret_key_2024_production_very_secure_long_key_for_authentication
      - JWT_EXPIRATION=2592000000
      # Email
      - SPRING_MAIL_USERNAME=salmanalam8083@gmail.com
      - SPRING_MAIL_PASSWORD=ixyhexizbeufecli
      # WhatsApp Cloud API
      - WHATSAPP_CLOUD_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-your-phone-number-id}
      - WHATSAPP_CLOUD_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-your-access-token}
      - WHATSAPP_ADMIN_PHONE=9304678815
      # Razorpay
      - RAZORPAY_KEY_ID=rzp_test_RblgQ2X8PdXSRw
      - RAZORPAY_KEY_SECRET=Y12S0JH0RXmApi4aC5JkRXHX
      # Admin
      - ADMIN_PHONE=9304678815
      - ADMIN_EMAIL=info@madarasaimdadululoom.in
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - madarsa_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================
  # React Frontend
  # =============================================
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: madarsa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - madarsa_network

networks:
  madarsa_network:
    driver: bridge